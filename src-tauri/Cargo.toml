[package]
name = "pantomim"
version = "0.1.0"
description = "SEB alternative for Linux"
authors = ["Dirga Yuditama"]
license = "MPL-2.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "pantomim_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
aes = "0.9.3"
base64 = "0.23.1"
flate2 = "1.1.10"
hmac = "0.13.0"
pbkdf2 = "0.13.0"
plist = "1.10.1"
sha1 = "0.11.0"
sha2 = "0.11.1"
cbc = { version = "0.2.1", features = ["alloc"] }
hex = "0.4"
gtk = "0.18"
ureq = "3.4.2"
serde_json = "1.0.154"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

